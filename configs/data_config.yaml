datasets:
  loco:
    name: "LOCO"
    type: "object_detection"
    format: "coco"
    archives:
      dataset.zip: "https://go.mytum.de/239870"

    # Relative extracted data path
    path: "dataset"

    # (Optional) relative directory path for annotations in the raw folder
    annotations_path: "annotations"

    metadata_urls:
      loco-sub1-v1-val.json: "https://raw.githubusercontent.com/tum-fml/loco/refs/heads/main/rgb/loco-sub1-v1-val.json"
      loco-sub2-v1-train.json: "https://raw.githubusercontent.com/tum-fml/loco/refs/heads/main/rgb/loco-sub2-v1-train.json"
      loco-sub3-v1-train.json: "https://raw.githubusercontent.com/tum-fml/loco/refs/heads/main/rgb/loco-sub3-v1-train.json"
      loco-sub4-v1-val.json: "https://raw.githubusercontent.com/tum-fml/loco/refs/heads/main/rgb/loco-sub4-v1-val.json"
      loco-sub5-v1-train.json: "https://raw.githubusercontent.com/tum-fml/loco/refs/heads/main/rgb/loco-sub5-v1-train.json"

    annotations:
      - "loco-sub1-v1-val.json"
      - "loco-sub2-v1-train.json"
      - "loco-sub3-v1-train.json"
      - "loco-sub4-v1-val.json"
      - "loco-sub5-v1-train.json"

    splits:
      train:
        - loco-sub2-v1-train.json
        - loco-sub3-v1-train.json
        - loco-sub5-v1-train.json
      val:
        - loco-sub1-v1-val.json
        - loco-sub4-v1-val.json

    # (Optional) image directory per annotation file, relative to the extracted data path.
    # Only needed when annotations carry 'file_name' without an explicity 'path'.
    # image_roots:
    #   loco-sub2-v1-train.json: dataset/subset-2
    #   loco-sub3-v1-train.json: dataset/subset-3
    #   loco-sub5-v1-train.json: dataset/subset-5
    #   loco-sub1-v1-val.json: dataset/subset-1
    #   loco-sub4-v1-val.json: dataset/subset-4

    # Explicit class mapping
    classes:
      small_load_carrier:
        coco_id: 3
        yolo_id: 0
      forklift:
        coco_id: 5
        yolo_id: 1
      pallet:
        coco_id: 7
        yolo_id: 2
      stillage:
        coco_id: 10
        yolo_id: 3
      pallet_truck:
        coco_id: 11
        yolo_id: 4
